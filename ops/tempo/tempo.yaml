# Minimal single-binary Tempo config (Phase 6 local stack).
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:
ingester:
  trace_idle_period: 10s
  max_block_duration: 5m
storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
