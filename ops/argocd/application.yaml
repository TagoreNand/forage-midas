apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: midas-core
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TagoreNand/forage-midas.git
    targetRevision: main
    path: ops/helm/midas-core
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: midas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
