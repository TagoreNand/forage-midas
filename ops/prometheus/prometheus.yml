# Prometheus scrape + rules config (Phase 5/6). Scrapes the app's Actuator/Micrometer endpoint
# and the OTel Collector; loads SLO/business alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: midas-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["midas-core:8081"]
        labels:
          application: midas-core

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
