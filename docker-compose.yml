# Midas Core - local topology mirroring production (ARCHITECTURE.md section 12).
# App + Kafka + PostgreSQL + Redis + full observability (OTel Collector, Prometheus, Grafana,
# Tempo, Loki). Run: make up  (or: docker compose up -d --build)

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: midas-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: midas-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${DB_NAME:-midas}
      POSTGRES_USER: ${DB_USER:-midas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-midas}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-midas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: midas-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  midas-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: midas-core
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "33400:33400"   # balance API (Forage BalanceQuerier)
      - "8081:8081"     # actuator / metrics
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-midas}
      DB_USER: ${DB_USER:-midas}
      DB_PASSWORD: ${DB_PASSWORD:-midas}
      SPRING_DATA_REDIS_HOST: redis
      MIDAS_CACHE_ENABLED: "true"
      MIDAS_SECURITY_ENABLED: "true"
      INCENTIVE_API_URL: ${INCENTIVE_API_URL:-http://host.docker.internal:8080}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.1
    container_name: midas-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
    depends_on: [tempo, loki]

  tempo:
    image: grafana/tempo:2.4.1
    container_name: midas-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./ops/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports: ["3200:3200"]

  loki:
    image: grafana/loki:2.9.8
    container_name: midas-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: midas-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.0.0
    container_name: midas-grafana
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on: [prometheus, tempo, loki]

volumes:
  pgdata:
