# Midas Core - CI/CD pipeline (Roadmap section 5.1, Phase 6).
# build -> unit + architecture + integration (Testcontainers) -> SAST + dependency scan ->
# image build & scan -> Helm lint -> load smoke. Mutation testing runs nightly.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Build + unit + architecture + integration tests
        run: ./mvnw -B verify
      - name: Static analysis (SpotBugs)
        run: ./mvnw -B spotbugs:check || true
      - name: OWASP dependency vulnerability scan
        run: ./mvnw -B org.owasp:dependency-check-maven:check || true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  docker-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t midas-core:${{ github.sha }} .
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: midas-core:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint chart
        run: helm lint ops/helm/midas-core
      - name: Render templates
        run: helm template midas ops/helm/midas-core > /tmp/rendered.yaml

  load-smoke:
    needs: docker-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start app (local profile, H2)
        run: docker compose up -d midas-core || true
      - name: k6 smoke test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: ops/load/transfer-load-test.js
        env:
          BASE_URL: http://localhost:33400
        continue-on-error: true

  mutation-testing:
    if: github.event_name == 'schedule'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: PIT mutation testing
        run: ./mvnw -B org.pitest:pitest-maven:mutationCoverage
